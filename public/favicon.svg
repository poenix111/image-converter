<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="grad-start" />
      <stop offset="100%" class="grad-end" />
    </linearGradient>
  </defs>
  <style>
    .logo-bg { fill: #6750A4; fill-opacity: 0.15; }
    .logo-src { stroke: #79747E; }
    .grad-start { stop-color: #6750A4; }
    .grad-end { stop-color: #7D5260; }
    
    @media (prefers-color-scheme: dark) {
      .logo-bg { fill: #D0BCFF; fill-opacity: 0.15; }
      .logo-src { stroke: #938F99; }
      .grad-start { stop-color: #D0BCFF; }
      .grad-end { stop-color: #EFB8C8; }
    }
  </style>
  <rect x="2" y="2" width="28" height="28" rx="8" class="logo-bg" />
  <rect x="6" y="6" width="16" height="16" rx="4" class="logo-src" stroke-width="1.5" stroke-dasharray="3 2" />
  <rect x="11" y="11" width="15" height="15" rx="4" stroke="url(#favicon-grad)" stroke-width="2" fill="url(#favicon-grad)" fill-opacity="0.1" />
  <path d="M12 20 L20 12 M20 12 H15 M20 12 V17" stroke="url(#favicon-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
